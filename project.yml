name: AlpacaPortfolioMonitor
options:
  bundleIdPrefix: com.alpacamonitor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AlpacaPortfolioMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpacamonitor.AlpacaPortfolioMonitor
        INFOPLIST_FILE: Sources/App/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleDisplayName: Alpaca Monitor
        NSHumanReadableCopyright: "Read-only Alpaca portfolio monitor."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  AlpacaPortfolioMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AlpacaPortfolioMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpacamonitor.AlpacaPortfolioMonitorTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AlpacaPortfolioMonitor:
    build:
      targets:
        AlpacaPortfolioMonitor: all
        AlpacaPortfolioMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlpacaPortfolioMonitorTests
