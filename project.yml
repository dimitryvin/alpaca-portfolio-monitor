name: AlpacaPortfolioMonitor
options:
  bundleIdPrefix: com.alpacamonitor
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  # ── macOS menu-bar app ──────────────────────────────────────────────────────
  AlpacaPortfolioMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpacamonitor.AlpacaPortfolioMonitor
        INFOPLIST_FILE: Sources/App/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleDisplayName: Alpaca Monitor
        NSHumanReadableCopyright: "Read-only Alpaca portfolio monitor."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  AlpacaPortfolioMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AlpacaPortfolioMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpacamonitor.AlpacaPortfolioMonitorTests
        GENERATE_INFOPLIST_FILE: YES

  # ── iOS companion app (TCA) ─────────────────────────────────────────────────
  AlpacaMonitorMobile:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOSApp
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
    # DEVELOPMENT_TEAM is supplied by a gitignored xcconfig (see Config/Signing.xcconfig.example)
    # so the Team ID stays out of version control. Xcode Cloud generates it from the
    # DEVELOPMENT_TEAM environment variable in ci_scripts/ci_post_clone.sh.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimitryvin.alpacamobile
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: iOSApp/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOSApp/App/Info.plist
      properties:
        CFBundleDisplayName: Alpaca Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Alpaca Monitor uses the camera to scan the pairing QR code shown by the Mac app so it can connect to your account."

  AlpacaMonitorMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSAppTests
    dependencies:
      - target: AlpacaMonitorMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimitryvin.alpacamobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AlpacaPortfolioMonitor:
    build:
      targets:
        AlpacaPortfolioMonitor: all
        AlpacaPortfolioMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlpacaPortfolioMonitorTests

  AlpacaMonitorMobile:
    build:
      targets:
        AlpacaMonitorMobile: all
        AlpacaMonitorMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlpacaMonitorMobileTests
